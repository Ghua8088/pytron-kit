[package]
name = "pytron_rust_bootloader"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py38"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libloading = "0.8"
bsdiff = "0.1"
rfd = "0.14"
obfstr = "0.4"
zip = "0.6"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "debugapi", "consoleapi", "shellapi", "objbase", "libloaderapi"] }

[build-dependencies]
embed-resource = "2.4"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"
