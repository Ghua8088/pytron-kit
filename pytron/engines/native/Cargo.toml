[package]
name = "pytron_native"
version = "0.1.0"
edition = "2021"

[lib]
name = "pytron_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py37"] }
wry = { version = "0.40", features = ["devtools"] }
tao = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2"
mime_guess = "2.0"
url = "2.5"
rfd = "0.14"
raw-window-handle = "0.6"
arboard = "3.4"
notify-rust = "4.11"
tray-icon = "0.19"

[target.'cfg(target_os = "windows")'.dependencies]
image = "0.25"
windows = { version = "0.52", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_UI_Controls",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Registry",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Graphics_Dwm",
    "Win32_System_Console"
] }

[build-dependencies]
pyo3-build-config = "0.23"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
panic = "abort"
