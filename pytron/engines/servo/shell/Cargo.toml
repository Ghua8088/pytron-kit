[package]
name = "pytron-servo"
version = "0.1.0"
edition = "2021"

[lib]
name = "pytron_servo"
crate-type = ["cdylib"]

[dependencies]
libservo = { package = "libservo", git = "https://github.com/servo/servo" }
surfman = "0.9"
gl = "0.14"
winit = "0.29"
softbuffer = "0.4"
url = "2.5"

rustls = { version = "0.23", features = ["aws-lc-rs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"
clap = { version = "4.5", features = ["derive"] }
pyo3 = { version = "0.29", features = ["extension-module"] }

[build-dependencies]
pyo3-build-config = "0.23"
